server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (long timeouts for LLM streaming).
    # Use Docker's embedded DNS (127.0.0.11) + a variable upstream so nginx
    # re-resolves the backend IP at runtime. Without this, nginx caches the
    # backend's IP at startup and returns 502 (connection refused) if the
    # backend container is recreated with a new IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sbir_backend backend;
        proxy_pass http://$sbir_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
