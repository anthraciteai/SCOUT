# MINIMAL local proof stack: frontend + backend, stub Ken/Jake/Matt,
# disk vault, host snap Ollama. No Keycloak, no SeaweedFS, no extra Ollama.
#
#   docker compose up --build
#
# Production-shaped (Keycloak + SeaweedFS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# GPU Ollama in-compose (only if you really want it; default uses the host snap):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  # Optional in-compose Ollama (not used by default — host snap owns :11434).
  #   docker compose --profile embedded up --build
  ollama:
    profiles: ["embedded"]
    image: ollama/ollama:latest
    container_name: scout-ollama
    ports:
      - "11436:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: scout-backend
    env_file:
      - .env
    # Snap Ollama listens on 127.0.0.1:11434 only. Host networking is how
    # the backend reaches it without publishing a second Ollama on :11434.
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    volumes:
      - app_data:/data
      - ./backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    container_name: scout-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
  app_data:
