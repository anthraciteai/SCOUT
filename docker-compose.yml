services:
  ollama:
    image: ollama/ollama:latest
    container_name: sbir-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU passthrough (needs Docker Desktop + NVIDIA driver on Windows/WSL2,
    # or nvidia-container-toolkit on Linux). Remove this line on machines w/o an
    # NVIDIA GPU (Ollama will then run on CPU).
    gpus: all

  backend:
    build:
      context: ./backend
    container_name: sbir-backend
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - app_data:/data
      - ./backend/app:/app/app
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    container_name: sbir-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
  app_data:
