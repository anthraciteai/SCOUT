# PRODUCTION overlay: Keycloak + SeaweedFS. Apply on top of the minimal local compose.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Local proof stays:
#   docker compose up --build
#
# Keycloak admin: http://localhost:8081  (admin / admin)
# SeaweedFS S3:   http://localhost:8333
# SCOUT UI:       http://localhost:8080
#
# Backend keeps host networking for snap Ollama, so Keycloak/SeaweedFS
# are published on localhost and the API talks to 127.0.0.1.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: scout-seaweedfs
    command: server -s3 -s3.config=/etc/seaweedfs/s3config.json -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: scout-keycloak
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    restart: unless-stopped

  backend:
    environment:
      - AUTH_DISABLED=false
      - AUTH_SECRET=${AUTH_SECRET:-scout-dev-secret-change-me}
      - DEFAULT_COMPANY=anthracite
      - VAULT_DIR=/data/vault
      - STORAGE_ENDPOINT=http://127.0.0.1:8333
      - STORAGE_BUCKET=scout
      - AWS_ACCESS_KEY_ID=scout
      - AWS_SECRET_ACCESS_KEY=scout-secret-key
      - AWS_REGION=us-east-1
      - KEYCLOAK_URL=http://127.0.0.1:8081
      - KEYCLOAK_PUBLIC_URL=http://localhost:8081
      - KEYCLOAK_REALM=scout
      - KEYCLOAK_AUDIENCE=scout-frontend
    depends_on:
      - seaweedfs
      - keycloak

volumes:
  seaweed_data:
