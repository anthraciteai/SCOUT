# Frontend live-reload dev server (Vite + HMR) with the source tree mounted.
# Edits under frontend/src hot-reload in the browser — no image rebuild.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The backend already bind-mounts ./backend/app, so backend code is live too
# (restart scout-backend to reload Python; Vite reloads the UI automatically).
services:
  frontend:
    # Drop the multi-stage nginx build; run the Vite dev server instead.
    build: !reset null
    image: node:22-alpine
    container_name: scout-frontend
    working_dir: /app
    # Install deps into the named volume (keeps the container's musl/alpine
    # binaries separate from any host node_modules), then run Vite bound to the
    # published port so HMR websockets line up with the browser.
    # Internal port == published port so Vite's HMR websocket lines up with the
    # browser. Uses 8090 (8080 is held by a stale Docker port reservation that
    # only a `sudo systemctl restart docker` would clear).
    command: sh -c "npm install && npm run dev -- --host --port ${DEV_PORT:-8090}"
    environment:
      # Vite proxies /api here; backend uses host networking on :8000.
      - BACKEND_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - scout_frontend_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-8090}:${DEV_PORT:-8090}"

volumes:
  scout_frontend_modules:
